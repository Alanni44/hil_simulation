# HIL Simulation Config
# Restart Python services after changes, no recompile needed

local_udp:
  command_port: 9997
  status_port: 9998
  # Must match UDP_SENSOR_PORT in c_core/src/local_udp.h.
  sensor_port: 9996

spring_boot:
  host: "192.168.100.138"
  websocket_port: 8080
  path: "/ws/hil"

# Business endpoint for Spring Boot.  This is intentionally separate from the
# loopback-only package-management WebSocket above.
spring_ws:
  listen_host: "0.0.0.0"
  listen_port: 8765
  path: "/ws/hil"
  publish_rate_hz: 50
  state_max_age_s: 0.5
  control_queue_size: 32
  send_timeout_s: 5
  request_cache_size: 256
  # The two-circle integration publishes state to 3.6; lifecycle control is
  # exclusively the formal simulator/HIL path, never this telemetry endpoint.
  allow_commands: false

# START/STOP controls only a pre-verified local executable; it never builds or
# deploys a package.  Configure executable_path on the HIL target before use.
model_runtime:
  control_mode: builtin_mission
  execution_mode: development
  executable_path: "artifacts/z_mission/bin/quadrotor_hil_rt"
  # Production deployments can instead select execution_mode: systemd and a
  # fixed, locally authorized systemd_unit such as hil-core@current.service.
  mission_path: "missions/z_mission.json"
  runtime_log: "runtime/spring-model.log"
  startup_timeout_s: 20
  core_ready_timeout_s: 3
  command_retry_attempts: 3
  command_retry_delay_s: 0.1
  stop_timeout_s: 10
  ready_sample_count: 3
  state_max_age_s: 0.5

ue4_tcp:
  # Formal V2 bridge target.  This is the UE4/AirSimBridge host, not a
  # local test endpoint; debug_ue4_tcp below is only used by debug tooling.
  host: "192.168.3.122"
  port: 5000

# Preserve deployed V2 multirotor sessions by default.  Select "3.0" only
# for a fixed-wing V3 deployment, which requires a rebuilt V3 C-core model.
bridge:
  protocol_version: "2.0"

# V3 formal role: this process listens, while the fixed-wing C-core/Simulink
# executable is the TCP client.  Set bridge.protocol_version to "3.0" and
# rebuild/deploy a fixed-wing package before enabling this endpoint.
fixed_wing_v3:
  host: "0.0.0.0"
  port: 5000
  airsim_enabled: false
  airsim_host: "127.0.0.1"
  airsim_vehicle_name: "FixedWing01"

# Dedicated terminal debug target; normal services keep ue4_tcp above.
debug_ue4_tcp:
  host: "192.168.3.122"
  port: 5000

# Raw framed TCP evidence for real UE4 debugging. Every fully sent and fully
# received V2 frame is recorded with its length header and UTF-8 JSON. The
# bounded rotation prevents a 50 Hz long-running session from filling disk.
wire_log:
  path: "runtime/z_debug/ue4_tcp_wire.jsonl"
  max_bytes: 16777216
  backup_count: 5

# PX4 MAVLink HIL is opt-in.  It only transports sensors/actuators; selecting
# px4_sitl remains an explicit WebSocket control-source action.
px4_hil:
  enabled: false
  peer_host: "127.0.0.1"
  peer_port: 14560
  bind_host: "127.0.0.1"
  bind_port: 14580
  system_id: 1
  component_id: 1
  actuator_count: 4
  imu_rate_hz: 250
  gps_rate_hz: 20
  origin_lat_deg: 31.2304
  origin_lon_deg: 121.4737
  origin_alt_m: 10.0

virtual_quad_fc:
  # Enable the local virtual-UUT path for closed-loop and live-tuning demos.
  # It does not require a UE4 connection.
  # Disabled for the Spring V0.3 demo_mission integration path.  Enabling it
  # is an explicit switch to the separate virtual-UUT control path.
  enabled: false
  hardware_id: "virtual_quad_fc_01"
  command_rate_hz: 250
  imu_rate_hz: 250
  barometer_rate_hz: 50
  gps_rate_hz: 20
  health_rate_hz: 10
  # Keep virtual-FC raw evidence bounded during long soak tests. Completed
  # chunks are gzip-compressed; no more raw data is recorded after max_run_mb.
  recording:
    max_file_mb: 64
    max_run_mb: 512
    retention_days: 14
  origin_lat_deg: 31.2304
  origin_lon_deg: 121.4737
  origin_alt_m: 10.0
  # Closed-loop virtual flight-controller vehicle estimates.  They are only
  # used by the virtual UUT control law; model parameters remain authoritative.
  mass_kg: 1.5
  thrust_coefficient_n: 4.2
  motor_efficiency: 1.0

logging:
  level: "INFO"
  file: "logs/hil.log"

# Internal GitLab release integration. The token must only be supplied through
# the service environment, never here.
gitlab_release:
  enabled: true
  # Internal GitLab currently provides only HTTP. Keep this false for every
  # HTTPS-capable deployment; enabling it sends the read-only token in cleartext.
  allow_insecure_http: true
  base_url: "http://192.168.100.181:3000"
  projects:
    - "hil/model-releases"
  release_asset_name: "hil_model_package.zip"
  timeout_seconds: 15
  max_download_mb: 512
  # A staged package may be built once and deployed once within this window.
  # Stage it again after the window expires or after either action is retried.
  stage_receipt_ttl_seconds: 1800
